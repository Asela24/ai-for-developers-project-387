# Reviewed, narrowly scoped waivers. Check expires before extending.
ignores:
  - rule: dangerous-triggers
    file: .github/workflows/claude.yml
    reason: >-
      The @claude feature requires issue_comment and pull_request_review_comment.
      The job is gated to OWNER/MEMBER/COLLABORATOR commenters, uses a read-only
      GITHUB_TOKEN, exchanges OIDC for the Claude GitHub App token, pins every
      action to a full SHA, and refuses pull requests from forks before any
      secret is used, so only same-repository PR code is ever run.
    expires: "2027-02-22"
