name: claude-deps

on:
  # Night from Monday to Tuesday, every week of November: Monday 22:00 UTC
  # (01:00 Tuesday, Moscow). Cron has no year field, so the gate step below
  # skips scheduled runs outside 2026.
  schedule:
    - cron: "0 22 * 11 1"
  # Manual run from the Actions tab, any date.
  workflow_dispatch:

# The job is the only consumer of these permissions.
permissions: {}

# One analysis at a time; a new run waits for the current one.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  outdated:
    name: Report outdated dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Exchanged for the Claude GitHub App token that writes the issue.
      id-token: write
    steps:
      - name: Gate on November 2026
        id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "schedule" ] && [ "$(date -u +%Y-%m)" != "2026-11" ]; then
            echo "Scheduled analysis runs only in November 2026; skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        if: steps.gate.outputs.run == 'true'
        with:
          version: 2026.11.3

      # The report is computed here, without the model, so the agent only reads
      # it and never runs pnpm. Scripts are skipped: nothing is built.
      - name: Collect outdated dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          # pnpm outdated exits 1 when it finds something; that is a result, not a failure.
          pnpm outdated -r --format json > outdated.json || [ -s outdated.json ]
          {
            echo "## pnpm outdated -r"
            echo '```json'
            cat outdated.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run Claude Code
        if: steps.gate.outputs.run == 'true'
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You analyse the dependencies of ${{ github.repository }} for outdatedness.
            Write everything on GitHub in Russian, in GLOSSARY.md terms.

            Context of this run:
            - The workflow runs on a schedule in the night from Monday to Tuesday
              (Monday 22:00 UTC) every week of November 2026, and can also be started
              manually (workflow_dispatch). This run: event `${{ github.event_name }}`.
            - The report for this run (link to it as "отчёт"):
              ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - The report data is `outdated.json` in the working directory, the output of
              `pnpm outdated -r --format json` (current, wanted, latest, dependent packages).
              An empty object means nothing is outdated.
            - The job has a 5-minute timeout: be brief, don't explore beyond what you need.

            There is exactly one issue for this, labelled `outdated-deps`. Find it with
            `gh issue list --label outdated-deps --state all`. If there is none, create the
            label (`gh label create outdated-deps`, ignore "already exists") and the issue
            «Устаревшие зависимости» with that label. If it is closed, reopen it. Never create
            a second issue; every run updates only this one.

            If something is outdated, for each dependency describe in the issue:
            - **Проблема:** package, current → latest version, which workspace package
              (`apps/server`, `apps/web`, root) uses it, and whether it is a major bump.
            - **Как затронет наш код:** what changes in the new version and which of our
              files use the package (find them with Grep), what may break.
            - **Предлагаемое действие:** update now, update with code changes (which), or wait,
              and why.
            - **Отчёт:** the report link above.

            Don't write the same thing twice. Read the issue body and comments first. A
            dependency already described with the same latest version gets no new text.
            Keep the issue body as the current list of outdated dependencies (edit it with
            `gh issue edit --body-file`), and add one comment per run that names only what is
            new or changed (new package, new latest version, package that is now up to date),
            with the report link. If nothing changed since the last comment, the comment is
            one line: no new outdated dependencies, plus the report link.

            If nothing is outdated, say so: the issue body states that all dependencies are
            up to date, and the run comment says the same with the report link.

            Do not change code, commit or open pull requests.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "Read,Grep,Glob,Write,Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh issue create:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh issue reopen:*),Bash(gh label create:*)"
