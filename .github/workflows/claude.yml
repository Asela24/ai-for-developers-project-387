name: claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# The job is the only consumer of these permissions.
permissions: {}

jobs:
  claude:
    name: Respond to @claude comment
    # Trusted humans only: bots are ignored, and so is everyone without a
    # repository role (the action re-checks write access before it runs).
    if: >-
      github.event.comment.user.type != 'Bot' &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR') &&
      contains(github.event.comment.body, '@claude')
    # One agent at a time across the repository; a new request waits for the
    # running one. Set on the job, not the workflow, so comments without
    # @claude (skipped runs) never take the queue slot from a real request.
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Lets Claude read CI results on PRs.
      actions: read
      # Lets the fork guard read the pull request.
      pull-requests: read
      # Exchanged for the Claude GitHub App token that comments and pushes.
      id-token: write
    steps:
      # Claude may run project commands on a PR's head, so fork code never
      # reaches a job that holds the model token and the App token.
      - name: Refuse fork pull requests
        if: github.event.issue.pull_request || github.event.pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          fork=$(gh api "repos/$REPO/pulls/$PR" --jq '.head.repo.fork')
          if [ "$fork" != "false" ]; then
            echo "::error::@claude does not run on pull requests from forks."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Same toolchain as CI, so the agent can run `mise run check`.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.3
      - run: pnpm install --frozen-lockfile

      - name: Run Claude Code
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@claude"
          additional_permissions: |
            actions: read
          # Skills in .claude/skills drive the issue tracker through gh
          # (docs/agents/issue-tracker.md) and verify work with project commands.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "Skill,Bash(gh issue:*),Bash(gh label:*),Bash(gh api:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(pnpm:*),Bash(mise run:*),Bash(git:*)"
